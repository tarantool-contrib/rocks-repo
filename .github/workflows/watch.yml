name: watch

# Opens a pull request adding each new release of tarantool-wasm-rs and
# EmmyLua to its table, with the checksums GitHub reports for its assets,
# and each new tag of a package. Nothing is published until it is merged:
# by a maintainer, or, for a package whose package.json says
# "auto_merge": true, by itself once the checks pass.
#
# The pull requests are opened by the GitHub App of the variable
# ROCKS_BOT_CLIENT_ID and the secret ROCKS_BOT_PRIVATE_KEY when they are
# set (README.md, For the administrators): the checks run on them, and
# those of an auto_merge package merge by themselves, the publish workflow
# then running on the merge. Without the App, the GITHUB_TOKEN of the
# workflow opens them, and they run no checks and merge by hand.

on:
  # Every hour: a tag of a package is published within the hour.
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: watch
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  watch:
    name: Watch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Push the branches of the pull requests and open them.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: app
        if: vars.ROCKS_BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ROCKS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ROCKS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull requests for new releases
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          WATCH_RUNS_CHECKS: ${{ steps.app.outputs.token != '' }}
        run: scripts/watch.sh
