name: yank

# Yanks a version-revision of a rock: marks its entry of the index
# "yanked": true in one commit to the branch index. Its release and its
# rocks stay: a project that locked it still installs it, but tt resolves no
# new dependency to it.

on:
  workflow_dispatch:
    inputs:
      rock:
        description: The rock, such as emmylua
        required: true
        type: string
      version:
        description: The version-revision, such as 0.25.1-1
        required: true
        type: string
      reason:
        description: Why, for the message of the commit
        required: false
        type: string

permissions: {}

# The group of the publish workflow: one run at a time writes the branch
# index. GitHub keeps one run of a group waiting and cancels any it had: a
# yank cancelled so is to be run again.
concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  yank:
    name: Yank ${{ inputs.rock }} ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Push the branch index.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Yank
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ROCK: ${{ inputs.rock }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
        run: scripts/yank.sh "$ROCK" "$VERSION" "$REASON"
