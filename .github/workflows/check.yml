name: check

# Checks the index against the releases: every published release is in it,
# every URL of it answers with what its sha256 says, and the rockspec of an
# entry is the one its rocks hold. On a pull request it also checks the
# tables and the scripts and packs the versions the pull request adds.

on:
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  index:
    name: Index
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tables of a pull request may yank what the index has not yet:
      # the publish workflow does once it is merged.
      - name: Check the index
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/fetch-index.sh "$RUNNER_TEMP/index.json"
          pending=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            pending=(--pending)
          fi
          scripts/check.sh "${pending[@]}" "$RUNNER_TEMP/index.json"

  lint:
    name: Tables and scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The merge commit and its first parent, the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check the tables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/fetch-index.sh "$RUNNER_TEMP/index.json"
          scripts/check-tables.sh "$RUNNER_TEMP/index.json" HEAD^1

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive=$RUNNER_TEMP/actionlint.tar.gz
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  pack:
    name: Pack
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Those packed from upstream assets: a build from source is made only
      # by the publish workflow.
      - id: plan
        name: Plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/fetch-index.sh "$RUNNER_TEMP/index.json"
          scripts/plan.sh "$RUNNER_TEMP/index.json" > "$RUNNER_TEMP/plan.json"
          pack=$(jq -c '[.publish[] | select(.release != "published" and (.source | not))]' "$RUNNER_TEMP/plan.json")
          echo "pack=$pack" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.pack != '[]'
        uses: ./.github/actions/setup-tt

      - if: steps.plan.outputs.pack != '[]'
        name: Pack
        env:
          PACK: ${{ steps.plan.outputs.pack }}
        run: |
          failed=0
          while read -r rock version; do
            scripts/publish.sh --pack-only "$rock" "$version" || failed=1
          done < <(jq -r '.[] | "\(.rock) \(.version)"' <<<"$PACK")
          exit "$failed"
